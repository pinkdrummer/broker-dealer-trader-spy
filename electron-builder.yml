# Signed Mac build. Does not read tasty keys from disk or env.
# Signing uses the Developer ID Application identity in the login keychain
# plus APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID.
# See docs/MAC_DISTRIBUTION.md.

appId: com.premiumalerts.desk
productName: Premium Alerts
copyright: Copyright © 2026 Jonathan Hawken
directories:
  output: dist
  buildResources: build
asar: false
files:
  - electron/**
  - package.json
  - public/**
  - src/**
  - scripts/**
  - server/**
  - migrations/**
  - vite.config.ts
  - tsconfig.json
  - node_modules/**
mac:
  category: public.app-category.finance
  icon: public/__grok/icon-180.png
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  artifactName: "${productName}-${version}-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
publish:
  provider: github
  owner: pinkdrummer
  repo: broker-dealer-trader-spy
  releaseType: release
